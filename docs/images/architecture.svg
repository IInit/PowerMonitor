<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI','Microsoft YaHei','MS Shell Dlg',sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#5B6B85"/>
    </marker>
    <style>
      .box{fill:#FFFFFF;stroke:#B9C4D6;stroke-width:1.2}
      .t{font-size:13px;fill:#16213A;font-weight:600}
      .s{font-size:11.5px;fill:#4B5563}
      .stage{font-size:11.5px;fill:#2C4C8A;font-weight:600}
      .lbl{font-size:12px;fill:#374151}
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#FBFCFE"/>

  <!-- 阶段标题 -->
  <text class="stage" x="42" y="34">① 数据源（Windows 原生 API）</text>
  <text class="stage" x="262" y="34">② 采样封装</text>
  <text class="stage" x="452" y="34">③ 积分 · 计价 · 账本</text>
  <text class="stage" x="672" y="34">④ 输出</text>

  <!-- 数据源 -->
  <rect class="box" x="30" y="52" width="200" height="62" rx="7"/>
  <text class="t" x="44" y="74">PDH 计数器</text>
  <text class="s" x="44" y="92">\Processor Information(_Total)</text>
  <text class="s" x="44" y="107">\% Processor Utility → CPU 负载</text>

  <rect class="box" x="30" y="124" width="200" height="62" rx="7"/>
  <text class="t" x="44" y="146">NVIDIA NVML</text>
  <text class="s" x="44" y="164">运行时加载 nvml.dll，逐卡读取</text>
  <text class="s" x="44" y="179">实测功耗与功耗上限</text>

  <rect class="box" x="30" y="196" width="200" height="62" rx="7"/>
  <text class="t" x="44" y="218">开机时刻</text>
  <text class="s" x="44" y="236">Kernel-Boot 事件 ID 30，回退</text>
  <text class="s" x="44" y="251">QueryUnbiasedInterruptTime</text>

  <rect class="box" x="30" y="268" width="200" height="62" rx="7"/>
  <text class="t" x="44" y="290">其他功耗常量</text>
  <text class="s" x="44" y="308">主板 / 内存 / 硬盘固定开销</text>
  <text class="s" x="44" y="323">可选计入显示器</text>

  <!-- SensorHub -->
  <rect class="box" x="262" y="140" width="150" height="118" rx="7" fill="#F4F7FC"/>
  <text class="t" x="278" y="172">SensorHub</text>
  <text class="s" x="278" y="194">统一采样接口</text>
  <text class="s" x="278" y="212">Reading</text>
  <text class="s" x="278" y="230">{ cpu, gpu, base, util }</text>

  <!-- EnergyMeter -->
  <rect class="box" x="452" y="96" width="180" height="206" rx="7" fill="#F4F7FC"/>
  <text class="t" x="468" y="126">EnergyMeter</text>
  <text class="s" x="468" y="148">· 梯形法功率积分 → Wh</text>
  <text class="s" x="468" y="168">· 峰 / 平 / 谷分时计价</text>
  <text class="s" x="468" y="188">· 日 / 月 / 年 / 每次开机</text>
  <text class="s" x="468" y="206">  / 小时时段 五维账本</text>
  <text class="s" x="468" y="226">· 自动剔除睡眠 / 关机空档</text>
  <text class="s" x="468" y="248">快照 Snapshot（只读）</text>
  <text class="s" x="468" y="268">当前 / 今日 / 本月 / 累计</text>
  <text class="s" x="468" y="288">平均 / 峰值 / 时段 / 电价</text>

  <!-- 输出 -->
  <rect class="box" x="672" y="70" width="198" height="70" rx="7"/>
  <text class="t" x="686" y="94">15 个显示项</text>
  <text class="s" x="686" y="114">功率 / 能耗 / 电费 / 时长 / 时段</text>
  <text class="s" x="686" y="130">任务栏窗口 · 主窗口 · Tooltip</text>

  <rect class="box" x="672" y="152" width="198" height="70" rx="7"/>
  <text class="t" x="686" y="176">用量统计窗口</text>
  <text class="s" x="686" y="196">五个标签页 + 合计</text>
  <text class="s" x="686" y="212">按天 / 按月 / 按年 / 开机 / 时段</text>

  <rect class="box" x="672" y="234" width="198" height="86" rx="7"/>
  <text class="t" x="686" y="258">设置对话框</text>
  <text class="s" x="686" y="278">电价设置：30 省居民电价预设</text>
  <text class="s" x="686" y="296">「应用」即时落盘并回显</text>
  <text class="s" x="686" y="312">选项：功耗模型 / 采样 / 校准</text>

  <!-- 箭头 -->
  <g stroke="#5B6B85" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <path d="M232 175 L258 175"/>
    <path d="M232 227 L246 227 L246 200"/>
    <path d="M232 83 L246 83 L246 152"/>
    <path d="M232 299 L246 299 L246 250"/>
    <path d="M414 199 L448 199"/>
    <path d="M632 140 L656 140 L656 105"/>
    <path d="M632 199 L656 199"/>
    <path d="M632 258 L656 258 L656 277"/>
  </g>

  <!-- 配置与账本 -->
  <rect class="box" x="452" y="336" width="86" height="52" rx="7" fill="#FFFDF3" stroke="#DCC98E"/>
  <text class="lbl" x="462" y="357">Config</text>
  <text class="s" x="462" y="375">config.json</text>

  <rect class="box" x="548" y="336" width="84" height="52" rx="7" fill="#FFFDF3" stroke="#DCC98E"/>
  <text class="lbl" x="558" y="357">State</text>
  <text class="s" x="558" y="375">state.json</text>

  <g stroke="#B99A47" stroke-width="1.3" fill="none">
    <path d="M495 336 L495 306" marker-end="url(#ar)"/>
    <path d="M590 336 L590 306" marker-end="url(#ar)"/>
  </g>
  <text class="s" x="452" y="410">原子写入（临时文件 + MoveFileEx），掉电 / 异常退出不丢账；运行中约每 20 秒落盘一次。</text>
  <text class="s" x="452" y="430">配置与账本默认存放在 TrafficMonitor 的插件配置目录。</text>
</svg>
