<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 528" width="434" height="528" font-family="'Segoe UI','Microsoft YaHei','MS Shell Dlg',sans-serif">
  <defs>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F4F4"/>
    </linearGradient>
    <style>
      .lbl{font-size:12px;fill:#1A1A1A}
      .val{font-size:12px;fill:#1A1A1A}
      .grp{font-size:12.5px;fill:#333333}
      .btn{font-size:12.5px;fill:#1A1A1A}
      .meta{font-size:11.5px;fill:#3A3A3A}
      .ok{font-size:11.5px;fill:#0F7B37;font-weight:600}
      .edit{fill:#FFFFFF;stroke:#B4B4B4}
    </style>
  </defs>

  <!-- 窗口边框 -->
  <rect x="20" y="20" width="394" height="485" rx="7" fill="#F0F0F0" stroke="#C9C9C9"/>
  <path d="M27 20 h380 a7 7 0 0 1 7 7 v23 h-394 v-23 a7 7 0 0 1 7 -7 z" fill="url(#titlebar)"/>
  <line x1="20" y1="50" x2="414" y2="50" stroke="#DCDCDC"/>
  <text x="36" y="40" font-size="12.5" fill="#1A1A1A">电价设置</text>
  <line x1="382" y1="28" x2="394" y2="40" stroke="#5A5A5A" stroke-width="1.2"/>
  <line x1="394" y1="28" x2="382" y2="40" stroke="#5A5A5A" stroke-width="1.2"/>

  <!-- 省份 / 方案 -->
  <text class="lbl" x="34" y="79">省份/地区</text>
  <rect class="edit" x="114.5" y="60.5" width="287" height="25" rx="2"/>
  <text class="val" x="121" y="77">四川</text>
  <path d="M386 69 l9 0 l-4.5 6 z" fill="#444"/>
  <text class="lbl" x="34" y="107">用电方案</text>
  <rect class="edit" x="114.5" y="88.5" width="287" height="25" rx="2"/>
  <text class="val" x="121" y="105">一户一表 第一档</text>
  <path d="M386 97 l9 0 l-4.5 6 z" fill="#444"/>

  <!-- 分组：电价 -->
  <rect x="28.75" y="120" width="374.5" height="112" rx="3" fill="none" stroke="#C6C6C6"/>
  <rect x="40" y="113" width="88" height="14" fill="#F0F0F0"/>
  <text class="grp" x="44" y="124">电价（元/度）</text>

  <text class="lbl" x="177.5" y="149" text-anchor="end">峰段电价</text>
  <rect class="edit" x="184.5" y="134" width="122.5" height="21" rx="2"/>
  <text class="val" x="190" y="149">0.5224</text>

  <text class="lbl" x="177.5" y="173.5" text-anchor="end">平段电价</text>
  <rect class="edit" x="184.5" y="158.5" width="122.5" height="21" rx="2"/>
  <text class="val" x="190" y="173.5">0.5224</text>

  <text class="lbl" x="177.5" y="198" text-anchor="end">谷段电价（枯/平水期）</text>
  <rect class="edit" x="184.5" y="183" width="122.5" height="21" rx="2"/>
  <text class="val" x="190" y="198">0.2535</text>

  <text class="lbl" x="177.5" y="222.5" text-anchor="end">谷段电价（丰水期）</text>
  <rect class="edit" x="184.5" y="207.5" width="122.5" height="21" rx="2"/>
  <text class="val" x="190" y="222.5">0.1750</text>

  <!-- 分组：时段与丰枯 -->
  <rect x="28.75" y="239" width="374.5" height="105" rx="3" fill="none" stroke="#C6C6C6"/>
  <rect x="40" y="232" width="76" height="14" fill="#F0F0F0"/>
  <text class="grp" x="44" y="243">时段与丰枯</text>

  <text class="lbl" x="177.5" y="268" text-anchor="end">峰段时段（如 8-22）</text>
  <rect class="edit" x="184.5" y="253" width="210" height="21" rx="2"/>
  <text class="val" x="190" y="268">8-22</text>

  <text class="lbl" x="177.5" y="292.5" text-anchor="end">谷段时段（如 23-7）</text>
  <rect class="edit" x="184.5" y="277.5" width="210" height="21" rx="2"/>
  <text class="val" x="190" y="292.5">23-7</text>

  <text class="lbl" x="177.5" y="317" text-anchor="end">丰水月（逗号分隔）</text>
  <rect class="edit" x="184.5" y="302" width="210" height="21" rx="2"/>
  <text class="val" x="190" y="317">6,7,8,9,10</text>

  <!-- 状态 / 来源信息 -->
  <text class="ok" x="34" y="370">● 已保存 20:33:12 → …\plugins\PowerMonitor_config.json</text>
  <text class="meta" x="34" y="391">来源：四川省电网居民生活电价表（川发改价格〔2012〕560号）</text>
  <text class="meta" x="34" y="409">生效：2026-07-01</text>
  <text class="meta" x="34" y="427">备注：7-9 月第一档 260 度及以下，其他月份 180 度及以下</text>
  <text class="meta" x="34" y="445" fill="#6A6A6A">提示：点「应用」立即落盘；单价可手工改写，不会被预设覆盖。</text>

  <!-- 按钮 -->
  <rect x="123" y="473.5" width="87.75" height="28" rx="4" fill="#FBFBFB" stroke="#B8B8B8"/>
  <text class="btn" x="166.9" y="491.5" text-anchor="middle">应用</text>

  <rect x="217.75" y="473.5" width="87.25" height="28" rx="4" fill="#E8F0FE" stroke="#2C6BED"/>
  <text class="btn" x="261.4" y="491.5" text-anchor="middle">确定</text>

  <rect x="312" y="473.5" width="87.75" height="28" rx="4" fill="#FBFBFB" stroke="#B8B8B8"/>
  <text class="btn" x="355.9" y="491.5" text-anchor="middle">取消</text>
</svg>
